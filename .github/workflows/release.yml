name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build portable exe
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      - name: Verify tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --format-version 1 --no-deps | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq "sottr-desktop" }).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $version"
          }

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build portable exe
        working-directory: apps/desktop
        env:
          # 去掉依赖源码中的编译机用户路径（与 SX-018 打包验收口径一致）。
          RUSTFLAGS: "--remap-path-prefix=C:\\Users\\runneradmin=/user --remap-path-prefix=D:\\a\\sottr-explorer\\sottr-explorer=/src"
        run: pnpm tauri build

      - name: Package assets
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag.StartsWith("v")) {
            $tag = "dev-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          $base = "SOTTR-Explorer-$tag-windows-x64"
          $exe = "$base.exe"
          Copy-Item "target/release/sottr-desktop.exe" $exe

          # Include the exe hash inside the archive; the published .zip.sha256
          # is the checksum of the archive itself.
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$exeHash *$exe" | Out-File -Encoding ascii "$exe.sha256"

          $stage = Join-Path $PWD "portable"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item $exe, "$exe.sha256" $stage
          @(
            "SOTTR Explorer $tag - Windows x64 portable"
            ""
            "1. Extract this archive to any folder."
            "2. Run $exe."
            "3. Verify: $exe.sha256 is the SHA-256 of the exe;"
            "   the .zip.sha256 next to the archive is the SHA-256 of the archive itself."
            ""
            "This build is not code-signed. Windows SmartScreen may warn about an unknown publisher."
          ) | Set-Content -Encoding ascii (Join-Path $stage "README.txt")

          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath "$base.zip" -CompressionLevel Optimal
          $zipHash = (Get-FileHash "$base.zip" -Algorithm SHA256).Hash.ToLower()
          "$zipHash *$base.zip" | Out-File -Encoding ascii "$base.zip.sha256"

          Get-Item "$base.zip", "$base.zip.sha256" | Format-Table Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-zip
          path: |
            SOTTR-Explorer-*-windows-x64.zip
            SOTTR-Explorer-*-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = "SOTTR-Explorer-$tag-windows-x64.zip"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            # Bare exe assets are no longer published; drop them on re-runs.
            gh release delete-asset $tag "SOTTR-Explorer-$tag-windows-x64.exe" --yes 2>$null
            gh release delete-asset $tag "SOTTR-Explorer-$tag-windows-x64.exe.sha256" --yes 2>$null
            gh release upload $tag $zip "$zip.sha256" --clobber
          } else {
            gh release create $tag $zip "$zip.sha256" `
              --title "SOTTR Explorer $tag" `
              --generate-notes `
              --latest
          }
