[workspace]
resolver = "3"
members = [
    "crates/sottr-core",
    "crates/sottr-cli",
    "apps/desktop/src-tauri",
]
# 默认只构建核心与 CLI（无 Tauri 依赖）；桌面端按需显式构建：
#   cargo check -p sottr-desktop
default-members = ["crates/sottr-core", "crates/sottr-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
tauri = "2"
tauri-build = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 桌面端发行配置（workspace 级生效；桌面打包在 SX-018 验收）
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 仅对显式声明 `[lints] workspace = true` 的成员生效（sottr-core / sottr-cli）
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
